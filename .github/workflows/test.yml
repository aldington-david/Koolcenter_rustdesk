name: Test and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends busybox qemu-user
      - name: Check router shell syntax
        run: |
          for script in rustdesk/install.sh rustdesk/uninstall.sh rustdesk/scripts/*.sh; do
            busybox ash -n "$script"
          done
      - name: Test scripts and ARM server startup
        run: python3 -m unittest discover -s tests -v
      - name: Build offline package
        run: python3 build.py
      - uses: actions/upload-artifact@v7
        with:
          name: rustdesk-offline-package
          path: |
            rustdesk.tar.gz
            config.json.js
